<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fanta Race</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
    }

    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }

    .logo-title {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo-title h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(90deg, #e63946, #f4a261, #e9c46a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-title p {
      margin-top: 6px;
      color: rgba(255,255,255,0.5);
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .file-drop {
      border: 2px dashed rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 28px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .file-drop:hover, .file-drop.drag-over {
      border-color: #e63946;
      background: rgba(230,57,70,0.08);
    }

    .file-drop input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .file-drop .icon { font-size: 2rem; margin-bottom: 8px; }

    .file-drop .hint {
      color: rgba(255,255,255,0.45);
      font-size: 0.82rem;
    }

    .file-drop .filename {
      color: #e9c46a;
      font-weight: 600;
      font-size: 0.9rem;
      margin-top: 6px;
    }

    input[type="text"], input[type="url"] {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 12px 16px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="url"]:focus {
      border-color: rgba(230,57,70,0.6);
    }

    input::placeholder { color: rgba(255,255,255,0.3); }

    .hint-text {
      margin-top: 6px;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.35);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #e63946, #f4a261);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.3px;
    }

    .btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .error {
      background: rgba(230,57,70,0.15);
      border: 1px solid rgba(230,57,70,0.4);
      border-radius: 10px;
      padding: 12px 16px;
      color: #ff8c94;
      font-size: 0.88rem;
      margin-bottom: 20px;
    }

    /* Loading overlay */
    #loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 12, 41, 0.88);
      backdrop-filter: blur(6px);
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    #loading-overlay.visible { display: flex; }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #e63946;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      color: rgba(255,255,255,0.6);
      font-size: 0.95rem;
      font-weight: 500;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: rgba(255,255,255,0.2);
      font-size: 0.78rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Elaborazione in corso...</div>
  </div>

  <div class="card">
    <div class="logo-title">
      <h1>Fanta Race</h1>
      <p>Visualizza la classifica della tua lega</p>
    </div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/upload" enctype="multipart/form-data">
      <div class="form-group">
        <label>File Calendario Excel</label>
        <div class="file-drop" id="drop-zone">
          <input type="file" name="excel" accept=".xlsx,.xls" required id="file-input">
          <div class="icon">📊</div>
          <div>Trascina qui il file o <strong>clicca</strong></div>
          <div class="hint">.xlsx · .xls</div>
          <div class="filename" id="file-name"></div>
        </div>
      </div>

      <div class="divider">opzionale</div>

      <div class="form-group">
        <label>Lega Fantagazzetta (per i loghi)</label>
        <input type="text" name="league_url"
               placeholder="URL o ID numerico della tua lega">
        <div class="hint-text">
          Es: https://leghe.fantagazzetta.com/nome-lega/123456 &nbsp;oppure solo&nbsp; 123456
        </div>
      </div>

      <button type="submit" class="btn">Genera Grafici</button>
    </form>
  </div>

  <script>
    const input = document.getElementById('file-input');
    const label = document.getElementById('file-name');
    const zone  = document.getElementById('drop-zone');

    input.addEventListener('change', () => {
      label.textContent = input.files[0]?.name || '';
    });

    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      if (e.dataTransfer.files.length) {
        input.files = e.dataTransfer.files;
        label.textContent = e.dataTransfer.files[0].name;
      }
    });

    document.querySelector('form').addEventListener('submit', () => {
      document.getElementById('loading-overlay').classList.add('visible');
    });
  </script>
</body>
</html>
